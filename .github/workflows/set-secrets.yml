name: Set backend secrets

# Copies values out of this repository's encrypted Actions secrets and into
# Google Secret Manager, where the Cloud Functions read them from.
#
# Why it exists: secrets cannot be set from a machine without network access to
# Google, and the Firebase CLI cannot create them interactively in CI. The value
# itself never appears in a workflow input (those are shown in the run UI) - it
# comes from an Actions secret and is piped straight into the CLI on stdin.
#
# ORDER MATTERS: a deployed function is pinned to the secret version that
# existed when it was deployed. Run this workflow FIRST, then "Deploy backend".
on:
  workflow_dispatch:
    inputs:
      secret:
        description: "Which secret to push into Secret Manager"
        required: true
        default: "STRIPE_WEBHOOK_SECRET"
        type: choice
        options:
          - STRIPE_WEBHOOK_SECRET
          - STRIPE_SECRET_KEY
          - RESEND_API_KEY
          - SENDGRID_API_KEY

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        run: npm install -g firebase-tools@13

      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Push the value into Secret Manager
        env:
          PROJECT: rod-runners-raffles
          NAME: ${{ inputs.secret }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        run: |
          set -euo pipefail
          VALUE="$(printenv "$NAME" || true)"
          if [ -z "$VALUE" ]; then
            echo "::error::Repository secret $NAME is empty. Add it under Settings -> Secrets and variables -> Actions, then run this again."
            exit 1
          fi
          # Sanity checks on shape, so a mistyped paste is caught here rather
          # than as a silent 400 on every incoming webhook.
          case "$NAME" in
            STRIPE_WEBHOOK_SECRET)
              case "$VALUE" in whsec_*) ;; *) echo "::error::STRIPE_WEBHOOK_SECRET should start with whsec_ - that is the signing secret from the endpoint's page, not the API key."; exit 1 ;; esac ;;
            STRIPE_SECRET_KEY)
              case "$VALUE" in sk_*|rk_*) ;; *) echo "::error::STRIPE_SECRET_KEY should start with sk_ or rk_."; exit 1 ;; esac ;;
            RESEND_API_KEY)
              case "$VALUE" in re_*) ;; *) echo "::error::RESEND_API_KEY should start with re_."; exit 1 ;; esac ;;
          esac
          # printf, not echo: a trailing newline becomes part of the secret and
          # breaks signature verification in a way that is very hard to see.
          printf '%s' "$VALUE" | firebase functions:secrets:set "$NAME" \
            --project "$PROJECT" --non-interactive --data-file -
          echo "Added a new version of $NAME. Now run \"Deploy backend\" so the functions pick it up."

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
