name: Deploy backend

# Pushes the Cloud Functions, Firestore rules and indexes to Firebase.
# Actions tab -> Deploy backend -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "everything"
        type: choice
        options: ["everything", "functions", "rules"]
      enforceAppCheck:
        description: "Require App Check on callable functions (turn off while testing debug builds)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        run: npm install -g firebase-tools@13

      - name: Build functions
        working-directory: functions
        run: npm ci && npm run build

      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. Add the service account JSON first."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Plain config values come from a dotenv file. The secrets themselves
      # must already exist in Secret Manager - the CLI cannot create them
      # non-interactively, so they are made once in the console by hand.
      - name: Write the config parameters
        env:
          PROJECT: rod-runners-raffles
          RRR_ENFORCE_APP_CHECK: ${{ inputs.enforceAppCheck }}
        run: |
          # RRR_ENFORCE_APP_CHECK has to live in the dotenv file, not just in
          # this step's shell. Shell variables reach the CLI process only; the
          # deployed function reads its environment from here. Setting it as a
          # step env var meant the flag never arrived, ENFORCE_APP_CHECK fell
          # back to its default of true, and every callable rejected the app
          # with UNAUTHENTICATED.
          {
            printf 'SUPPORT_EMAIL=support@rodrunners.co.uk\n'
            printf 'FROM_EMAIL=no-reply@rodrunners.co.uk\n'
            printf 'RRR_ENFORCE_APP_CHECK=%s\n' "$RRR_ENFORCE_APP_CHECK"
          } > "functions/.env.$PROJECT"
          cat "functions/.env.$PROJECT"

      # A function that declares a secret cannot be deployed until that secret
      # exists: the CLI stops and prompts for a value, which in CI just hangs
      # and then fails. RESEND_API_KEY did exactly that and every deploy since
      # the mail queue landed has died here. Seed whatever is missing with the
      # word "placeholder" - the code treats that as unset - so a deploy is
      # never blocked by a provider we have not signed up for yet.
      - name: Make sure every declared secret exists
        env:
          PROJECT: rod-runners-raffles
        run: |
          for NAME in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET RESEND_API_KEY SENDGRID_API_KEY; do
            if firebase functions:secrets:access "$NAME" --project "$PROJECT" >/dev/null 2>&1; then
              echo "$NAME already exists - left untouched"
            else
              echo "$NAME is missing - seeding it with a placeholder"
              printf 'placeholder' | firebase functions:secrets:set "$NAME" \
                --project "$PROJECT" --non-interactive --data-file -
            fi
          done

      - name: Deploy
        env:
          RRR_ENFORCE_APP_CHECK: ${{ inputs.enforceAppCheck }}
          PROJECT: rod-runners-raffles
        run: |
          set -o pipefail
          case "${{ inputs.target }}" in
            functions) ONLY="functions" ;;
            rules)     ONLY="firestore:rules,firestore:indexes,storage" ;;
            *)         ONLY="functions,firestore:rules,firestore:indexes,storage" ;;
          esac
          firebase deploy --only "$ONLY" --project "$PROJECT" --non-interactive --force 2>&1 | tee deploy.log

      - name: Publish the log when it fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          cp deploy.log /tmp/logs/deploy.log 2>/dev/null || echo "the deploy step never ran - the failure was earlier" > /tmp/logs/deploy.log
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add deploy.log
          git commit -qm "deploy log for run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
