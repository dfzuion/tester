name: Deploy backend

# Pushes the Cloud Functions, Firestore rules and indexes to Firebase.
# Actions tab -> Deploy backend -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "everything"
        type: choice
        options: ["everything", "functions", "rules"]
      enforceAppCheck:
        description: "Require App Check on callable functions (turn off while testing debug builds)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tooling
        run: npm install -g firebase-tools@13

      - name: Build functions
        working-directory: functions
        run: npm ci && npm run build

      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. Add the service account JSON first."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # Firebase asks for every declared parameter at deploy time. Plain
      # config values come from a dotenv file; secrets must already exist in
      # Secret Manager. Anything missing gets an obvious placeholder so the
      # deploy completes - real values are set afterwards and survive, because
      # existing secrets are never overwritten.
      - name: Ensure parameters and secrets exist
        env:
          PROJECT: rod-runners-raffles
        run: |
          set -x
          cat > functions/.env."$PROJECT" <<'ENVEOF'
          SUPPORT_EMAIL=support@rodrunnersraffles.co.uk
          FROM_EMAIL=no-reply@rodrunnersraffles.co.uk
          ENVEOF
          sed -i 's/^[[:space:]]*//' functions/.env."$PROJECT"
          cat functions/.env."$PROJECT"

          for NAME in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET SENDGRID_API_KEY ADMIN_BOOTSTRAP_KEY; do
            if firebase functions:secrets:access "$NAME" --project "$PROJECT" >/dev/null 2>&1; then
              echo "secret $NAME already exists - leaving it alone"
            else
              echo "creating placeholder secret $NAME"
              printf 'PLACEHOLDER_REPLACE_ME' > /tmp/secret.txt
              firebase functions:secrets:set "$NAME" --project "$PROJECT" \
                --data-file /tmp/secret.txt --non-interactive
              rm -f /tmp/secret.txt
            fi
          done
          echo "--- secrets now present ---"
          firebase functions:secrets:get --project "$PROJECT" || true

      - name: Deploy
        env:
          RRR_ENFORCE_APP_CHECK: ${{ inputs.enforceAppCheck }}
          PROJECT: rod-runners-raffles
        run: |
          set -o pipefail
          case "${{ inputs.target }}" in
            functions) ONLY="functions" ;;
            rules)     ONLY="firestore:rules,firestore:indexes,storage" ;;
            *)         ONLY="functions,firestore:rules,firestore:indexes,storage" ;;
          esac
          firebase deploy --only "$ONLY" --project "$PROJECT" --non-interactive --force 2>&1 | tee deploy.log

      - name: Publish the log when it fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs
          cp deploy.log /tmp/logs/deploy.log 2>/dev/null || echo "the deploy step never ran - the failure was earlier" > /tmp/logs/deploy.log
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add deploy.log
          git commit -qm "deploy log for run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
