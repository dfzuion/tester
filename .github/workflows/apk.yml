name: Test APK

# Builds an installable APK without anyone needing Android Studio.
# Actions tab -> Test APK -> Run workflow, then download the artifact.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore the shared debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > keystore/debug.keystore
            echo "Using the shared debug key, fingerprint:"
            keytool -list -v -keystore keystore/debug.keystore -storepass android \
              -alias androiddebugkey 2>/dev/null | grep -E "SHA1:|SHA256:" || true
          else
            echo "::warning::No DEBUG_KEYSTORE_BASE64 secret. This build gets a random debug key, so Google sign-in will fail with 'no credentials available'."
          fi

      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using the configured Firebase project."
          else
            cp app/google-services.json.example app/google-services.json
            echo "::warning::No GOOGLE_SERVICES_JSON secret set. This APK will install and open, but every screen that needs data will show a connection error. Add the secret for a working build."
          fi

      - name: Build
        env:
          # The publishable key is safe to ship inside the app - it can only
          # start a payment, never move money. The secret key never comes near
          # the client and lives in Secret Manager server-side.
          STRIPE_PUBLISHABLE_KEY_TEST: ${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST }}
        run: |
          set -o pipefail
          gradle assembleStagingDebug --stacktrace 2>&1 | tee build.log

      - name: Publish build log to the ci-logs branch
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.email "ci@example.com"
          git config user.name "ci"
          git add build.log
          git commit -qm "build log for run $GITHUB_RUN_ID"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: rod-runners-raffles-apk
          path: app/build/outputs/apk/staging/debug/*.apk
          retention-days: 30
