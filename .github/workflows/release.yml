name: Release bundle

# Builds the signed production AAB. Tag a commit (v1.0.0) or run it by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name, e.g. 1.0.1"
        required: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RRR_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/upload.jks
          # Fail now rather than at signing time if the secret was empty.
          test -s keystore/upload.jks

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          test -s app/google-services.json

      - name: Run function tests
        working-directory: functions
        run: npm ci && npm run lint && npm test

      - name: Unit tests
        run: gradle testProductionReleaseUnitTest

      - name: Build signed bundle
        env:
          RRR_KEYSTORE_PATH: keystore/upload.jks
          RRR_KEYSTORE_PASSWORD: ${{ secrets.RRR_KEYSTORE_PASSWORD }}
          RRR_KEY_ALIAS: ${{ secrets.RRR_KEY_ALIAS }}
          RRR_KEY_PASSWORD: ${{ secrets.RRR_KEY_PASSWORD }}
          STRIPE_PUBLISHABLE_KEY_LIVE: ${{ secrets.STRIPE_PUBLISHABLE_KEY_LIVE }}
          RRR_VERSION_CODE: ${{ github.run_number }}
          RRR_VERSION_NAME: ${{ inputs.versionName || github.ref_name }}
        run: gradle bundleProductionRelease

      - name: Remove secrets from the runner
        if: always()
        run: rm -f keystore/upload.jks app/google-services.json

      - uses: actions/upload-artifact@v4
        with:
          name: rod-runners-raffles-aab
          path: app/build/outputs/bundle/productionRelease/*.aab
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: app/build/outputs/mapping/productionRelease/mapping.txt
          retention-days: 90
