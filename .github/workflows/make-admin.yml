name: Make me admin

# Grants Super Admin to an account that has already signed up in the app.
# Actions tab -> Make me admin -> Run workflow. The email is pre-filled.
#
# This exists because the in-app bootstrap key depends on a Secret Manager
# version that Cloud Functions pin at deploy time, which made it impossible to
# change without a redeploy. This runs with the deploy service account instead,
# so there is no key to get wrong.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email address of the account to promote"
        required: true
        default: "dfuzion@protonmail.com"
        type: string

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the admin SDK
        run: npm install firebase-admin@12 --no-save

      - name: Authenticate
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Grant Super Admin
        env:
          PROJECT: rod-runners-raffles
          ADMIN_EMAIL: ${{ inputs.email }}
        run: node .github/scripts/makeadmin.js

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
